name: SonarQube Cloud

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master

jobs:
  sonar:
    name: Analyse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Volledige history: Sonar gebruikt git blame om issues aan een auteur
          # en aan een datum te koppelen (nodig voor "new code").
          fetch-depth: 0

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=SebastiaanvanOorschot_Resume
            -Dsonar.organization=sebastiaanvanoorschot
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/dist/**
